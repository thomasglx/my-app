<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyApp</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-title" content="MyApp">
  <meta name="theme-color" content="#263F48">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><img src="icon.svg" alt=""><span>MyApp</span></div>
      <nav>
        <a class="nav-item active" data-section="offers" href="#offers">
          <span class="nav-ico">◇</span><span>MyOffers</span><span class="nav-badge gold" id="nav-actions" title="Actions needed"></span><span class="nav-badge" id="nav-count" title="Offers to apply to"></span>
        </a>
        <div class="nav-soon">More sections soon</div>
      </nav>
      <div class="sidebar-foot">
        <button class="link" id="btn-disconnect" hidden>Disconnect</button>
      </div>
    </aside>

    <main id="main">
      <!-- Setup (first launch) -->
      <section id="setup" class="setup" hidden>
        <div class="setup-card">
          <img src="icon.svg" alt="" class="setup-icon">
          <h1>Welcome to MyApp</h1>
          <p>Paste your GitHub access key once. It stays only in this browser, on this Mac, and is never sent anywhere except GitHub.</p>
          <form id="setup-form">
            <input id="token" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false" required>
            <button class="btn primary" type="submit">Connect</button>
          </form>
          <p class="error" id="setup-error"></p>
        </div>
      </section>

      <!-- MyOffers -->
      <section id="offers" hidden>
        <header class="page-head">
          <div>
            <h1>MyOffers</h1>
            <div class="freshness" id="freshness"></div>
          </div>
          <button class="btn ghost" id="btn-refresh" title="Reload the data">↻ Refresh</button>
        </header>
        <div id="banners"></div>
        <div id="actions"></div>

        <div class="toolbar">
          <div class="tabs" id="tabs"></div>
          <div class="filters">
            <input id="search" type="search" placeholder="Search firm or role…">
            <select id="market"><option value="">All locations</option></select>
            <label class="toggle"><input type="checkbox" id="top-only"> ★ Top firms</label>
          </div>
          <div class="bands" id="band-filter"></div>
        </div>

        <div id="list"></div>
      </section>
    </main>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <dialog id="rename-dialog">
    <form method="dialog" id="rename-form">
      <h3>Edit entry</h3>
      <label>Firm<input id="rename-company"></label>
      <label>Role<input id="rename-title"></label>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel">Cancel</button>
        <button class="btn primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/github.js"></script>
  <script src="js/offers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
